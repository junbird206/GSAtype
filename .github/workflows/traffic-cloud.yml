name: Owned Site Browser Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * 25-27 11 *'

permissions:
  contents: read
  actions: write

concurrency:
  group: owned-site-browser-checks
  cancel-in-progress: false

jobs:
  traffic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore previous checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const latest = artifacts.filter(a => !a.expired && a.name.startsWith('traffic-state-20261124-'))
              .sort((a,b) => b.id-a.id)[0];
            if (latest) {
              const zip = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: latest.id, archive_format: 'zip'
              });
              fs.writeFileSync('/tmp/traffic-state.zip', Buffer.from(zip.data));
              fs.mkdirSync('.local-data/cloud-checkpoint', { recursive: true });
              await exec.exec('unzip', ['-o', '/tmp/traffic-state.zip', '-d', '.local-data/cloud-checkpoint']);
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'traffic-cloud.yml', status: 'completed', per_page: 1
              });
              if (runs.data.total_count) throw new Error('Missing prior checkpoint: refusing to replay visits.');
            }
      - name: Prepare bounded schedule and reserve pending slots
        id: state
        run: node .github/traffic/cloud-state.mjs prepare
      - name: Save reservations before sending traffic
        uses: actions/upload-artifact@v4
        with:
          name: traffic-state-20261124-${{ github.run_id }}-reserved
          path: .local-data/cloud-checkpoint/checkpoint.json
          retention-days: 3
          if-no-files-found: error
      - name: Disable schedule after deadline
        if: steps.state.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable traffic-cloud.yml --repo "$GITHUB_REPOSITORY"
      - name: Unit tests
        run: node --test tests/traffic-check.test.mjs tests/ga4-check.test.mjs tests/cloud-state.test.mjs
      - name: Install isolated browser runtime
        if: steps.state.outputs.active == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/traffic-runtime" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/traffic-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify first cloud connection if this hour was already tested
        if: steps.state.outputs.probe == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/traffic-runtime/node_modules
        run: node .github/traffic/cloud-state.mjs probe
      - name: Execute scheduled visits and ten percent clicks
        if: steps.state.outputs.active == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/traffic-runtime/node_modules
          TRAFFIC_CLOUD_RESERVED: ${{ steps.state.outputs.slots }}
        run: node scripts/traffic-check.mjs
      - name: Export checkpoint and results
        if: always() && steps.state.outcome == 'success'
        run: node .github/traffic/cloud-state.mjs export
      - name: Update durable checkpoint
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-state-20261124-${{ github.run_id }}-complete
          path: .local-data/cloud-checkpoint/checkpoint.json
          retention-days: 3
      - name: Retain detailed results
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-results-${{ github.run_id }}
          path: .local-data/traffic-check-20261124/*.json
          retention-days: 3
