name: Timed Low Volume Browser Checks
on:
  workflow_dispatch:
    inputs:
      wait_for_start:
        type: boolean
        default: false
        description: Wait in the cloud until the requested first window
  schedule:
    - cron: '7,22,37,52 * 26,27 11 *'
permissions:
  contents: read
  actions: write
concurrency:
  group: owned-site-browser-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore quarter checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            const latest = artifacts.filter(a => !a.expired && a.name.startsWith('traffic-windowed-state-20261126-')).sort((a,b)=>b.id-a.id)[0];
            if (latest) {
              const zip = await github.rest.actions.downloadArtifact({...context.repo, artifact_id:latest.id, archive_format:'zip'});
              fs.writeFileSync('/tmp/windowed.zip', Buffer.from(zip.data));
              fs.mkdirSync('.local-data/windowed', {recursive:true});
              await exec.exec('unzip', ['-o','/tmp/windowed.zip','-d','.local-data/windowed']);
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'traffic-windowed.yml',status:'completed',per_page:1});
              if(runs.data.total_count) throw new Error('Missing checkpoint; refusing duplicate visits.');
            }
      - name: Reserve current active quarter
        id: state
        env:
          WAIT_FOR_START: ${{ github.event.inputs.wait_for_start || 'false' }}
        run: node .github/traffic/windowed.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-windowed-state-20261126-${{ github.run_id }}
          path: .local-data/windowed/checkpoint.json
          retention-days: 3
          if-no-files-found: error
      - name: End schedule after final morning window
        if: steps.state.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable traffic-windowed.yml --repo "$GITHUB_REPOSITORY"
      - name: Test schedule boundaries
        run: node --test tests/windowed.test.mjs tests/ga4-check.test.mjs
      - name: Install browser
        if: steps.state.outputs.active == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/traffic-runtime" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/traffic-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Execute low volume browser checks
        if: steps.state.outputs.active == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/traffic-runtime/node_modules
          TRAFFIC_CLOUD_RESERVED: ${{ steps.state.outputs.slots }}
        run: node .github/traffic/windowed.mjs run
      - uses: actions/upload-artifact@v4
        if: always() && steps.state.outcome == 'success'
        with:
          name: traffic-windowed-results-${{ github.run_id }}
          path: .local-data/windowed/*.json
          retention-days: 3
